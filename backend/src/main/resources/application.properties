server.port=8080
spring.application.name=interflu-inventory

# SQLite Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:interflu_inventory.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA busy_timeout=60000; PRAGMA synchronous=NORMAL; PRAGMA foreign_keys=ON; PRAGMA cache_size=-64000; PRAGMA temp_store=MEMORY;
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# File upload limits for importing catalog or Excel
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Secret - 7 days expiration for warehouse operation
jwt.secret=interflu-inventory-super-secret-key-2026-industrial-fluids-secure-key-998877
jwt.expiration-ms=604800000

