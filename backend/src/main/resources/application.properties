server.port=8080
spring.application.name=interflu-inventory

# SQLite Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:interflu_inventory.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000; PRAGMA synchronous=NORMAL; PRAGMA foreign_keys=ON; PRAGMA cache_size=-32000;
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# File upload limits for importing catalog or Excel
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Secret
jwt.secret=interflu-inventory-super-secret-key-2026-industrial-fluids-secure-key-998877
jwt.expiration-ms=86400000
